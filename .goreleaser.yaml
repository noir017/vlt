version: 2

project_name: vlt

before:
  hooks:
    - go mod tidy

builds:
  - id: linux
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [386, amd64, arm, arm64, loong64, mips, mips64, mips64le, mipsle, ppc64, ppc64le, riscv64, s390x]
    goarm: ["6", "7"]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

  - id: darwin
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: windows
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [386, amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: freebsd
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [freebsd]
    goarch: [386, amd64, arm, arm64]
    goarm: ["6", "7"]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: openbsd
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [openbsd]
    goarch: [386, amd64, arm, arm64, ppc64, riscv64]
    goarm: ["6", "7"]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: netbsd
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [netbsd]
    goarch: [386, amd64, arm, arm64]
    goarm: ["6", "7"]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: dragonfly
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [dragonfly]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: solaris
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [solaris]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: illumos
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [illumos]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: aix
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [aix]
    goarch: [ppc64]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: plan9
    main: ./cmd/vlt
    binary: vlt
    env: [CGO_ENABLED=0]
    goos: [plan9]
    goarch: [386, amd64, arm]
    flags: [-trimpath]
    ldflags: *ldflags

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
